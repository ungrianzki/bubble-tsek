name: Build Bubble Tsek APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install app files
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BubbleTsek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BubbleTsek-apk
          path: BubbleTsek.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BubbleTsek.apk \
            --title "Bubble Tsek v1.0.${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap BubbleTsek.apk to install." \
            --latest
