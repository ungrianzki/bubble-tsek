<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble Tsek</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#15202B; --muted:#56636E; --line:#D3DBE1;
  --accent:#2152A3; --accent-ink:#FFFFFF; --accent-soft:#E2EBF8;
  --ok:#1B7A4C; --ok-soft:#DCF1E5; --bad:#BC3726; --bad-soft:#FAE2DD; --warn:#9A6200; --warn-soft:#FBEFD5;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 8px 24px rgba(21,32,43,.07);
  --r:14px; --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161E25; --surface2:#1B252D; --ink:#E6ECF0; --muted:#98A6B0; --line:#2B3741;
  --accent:#86ACF2; --accent-ink:#0E1317; --accent-soft:#1C2B44;
  --ok:#5DCB94; --ok-soft:#163427; --bad:#F08B7B; --bad-soft:#3B1F1A; --warn:#E5B04C; --warn-soft:#342A10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161E25; --surface2:#1B252D; --ink:#E6ECF0; --muted:#98A6B0; --line:#2B3741;
  --accent:#86ACF2; --accent-ink:#0E1317; --accent-soft:#1C2B44;
  --ok:#5DCB94; --ok-soft:#163427; --bad:#F08B7B; --bad-soft:#3B1F1A; --warn:#E5B04C; --warn-soft:#342A10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.logo i{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--ink)}
.logo i.f{background:var(--accent);border-color:var(--accent)}
.brand b{font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.1}
/* stepper */
.stepper{overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.stepper ol{display:flex;gap:4px;list-style:none;margin:0;padding:0;min-width:max-content}
.st{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px 8px 6px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem;white-space:nowrap}
.st:disabled{cursor:not-allowed;opacity:.5}
.st:not(:disabled):hover{background:var(--surface)}
.st-b{width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none}
.st.done{color:var(--ink)} .st.done .st-b{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.st.cur{color:var(--accent);font-weight:600;background:var(--surface)} .st.cur .st-b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
@media (max-width:560px){.panel{padding:16px}}
.eyebrow{margin:0 0 4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:1.6rem;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
h2{margin:0 0 10px;font-size:1.15rem;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:62ch}
.head{margin-bottom:20px}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:20px}
.note p{margin:0;max-width:52ch}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:.95rem}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert ul{margin:6px 0 0;padding-left:20px} .alert b{font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-align:center;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.actions .grp{display:flex;flex-wrap:wrap;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
/* fields */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:28px;align-items:start}
@media (max-width:760px){.setup{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 20px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.help{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.err{margin:6px 0 0;font-size:.85rem;color:var(--bad);font-weight:500}
.spin{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:220px}
.spin:focus-within{border-color:var(--accent)}
.spin input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 4px;-moz-appearance:textfield}
.spin input::-webkit-outer-spin-button,.spin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spin input:focus{outline:none}
.spin button{width:50px;border:0;background:var(--surface2);font-size:1.4rem;cursor:pointer}
.spin button:hover{background:var(--accent-soft)}
.spin input:disabled,.spin button:disabled{opacity:.5;cursor:not-allowed}
.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:1rem;min-height:48px}
.txt:focus{outline:none;border-color:var(--accent)}
.preview{margin:0;position:sticky;top:12px}
.preview .paper{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.14);overflow:hidden;border:1px solid var(--line)}
.preview svg{display:block;width:100%;height:auto}
.preview figcaption{font-size:.82rem;color:var(--muted);margin-top:8px;text-align:center}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* answer key grid */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px}
.krow{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.qn{width:32px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.opts{display:flex;gap:6px}
.bub{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;font-weight:600;font-size:.9rem;display:grid;place-items:center;padding:0}
.bub:hover{background:var(--accent-soft)}
.bub.on{background:var(--ink);color:var(--surface)}
.krow.miss .qn{color:var(--bad)}
.kgrid.compact{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kgrid.compact .bub{width:32px;height:32px;font-size:.8rem}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
.cell-c{color:var(--ok);font-weight:600} .cell-w{color:var(--bad);font-weight:600} .cell-b{color:var(--muted)} .cell-m{color:var(--warn);font-weight:600}
td.keycol{background:var(--ok-soft);color:var(--ok);font-weight:600}
.dim{color:var(--muted)}
/* scan */
.scan{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.scan{grid-template-columns:1fr}}
.cam-box{position:relative;background:#0B0F12;border-radius:14px;overflow:hidden;min-height:300px;display:grid;place-items:center}
.cam-box video{display:block;width:100%;height:auto}
.cam-box canvas.ov{position:absolute;left:0;top:0;pointer-events:none}
.cam-idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#DCE3E8;padding:20px}
.cam-idle p{margin:0 0 14px;max-width:34ch}
.cam-guide{position:absolute;inset:6%;border:2px dashed rgba(255,255,255,.35);border-radius:10px;pointer-events:none}
.cam-status{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--surface2);font-weight:500;min-height:46px;display:flex;align-items:center;gap:10px}
.cam-status.ok{background:var(--ok-soft);color:var(--ok)} .cam-status.bad{background:var(--bad-soft);color:var(--bad)} .cam-status.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.cam-ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.side{display:grid;gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.big{font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}
.recent{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recent li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.recent li:last-child{border-bottom:0}
.recent span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface2);border-radius:12px;padding:14px}
.tile small{display:block;color:var(--muted);font-size:.8rem;font-weight:500}
.tile b{font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:700}
.tile b span{font-size:.9rem;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.big-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.big-actions .btn{min-height:56px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,12,16,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:520px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow-y:auto}
.sheet.wide{max-width:920px}
.sheet h2{font-size:1.3rem}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:760px){.res{grid-template-columns:1fr}}
.res-img canvas{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;margin:0 auto;border-radius:8px;border:1px solid var(--line)}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:3.2rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-size:1.2rem}
.who{font-size:1.2rem;font-weight:600;margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.spacer{height:14px}
/* auto-save popup + switches */
.autopop{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px 0;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;animation:apIn .18s ease-out;z-index:5}
@keyframes apIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.ap-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ap-ok{color:var(--ok);font-weight:700}
.ap-score{color:var(--muted)}.ap-score b{font-size:1.8rem;color:var(--ink);font-variant-numeric:tabular-nums}
.ap-name{font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-roll{color:var(--muted);font-size:.85rem}
.ap-btns{display:flex;gap:8px;margin:10px 0 12px}.ap-btns .btn{flex:1}
.ap-bar{height:5px;background:var(--surface2);margin:0 -14px}.ap-bar i{display:block;height:100%;background:var(--ok);animation:apBar 2s linear forwards}
@keyframes apBar{from{width:100%}to{width:0}}
.tgl-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tgl-row+.tgl-row{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tgl-row p{margin:2px 0 0}
.tgl{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.tgl.on{background:var(--ok)}.tgl.on i{left:25px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i></div>
      <div><b>Bubble Tsek</b><small>Bubble sheet checker for teachers</small></div>
    </div>
    <button class="btn small" data-act="newExam" id="btnNew">New exam</button>
  </header>
  <nav class="stepper" id="stepper" aria-label="Steps"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileKey" accept=".csv,.xlsx,.xls,text/csv" hidden>
<input type="file" id="fileList" accept=".csv,.xlsx,.xls,text/csv" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>

<script>
/* ================= constants & geometry (millimetres on US Letter) ================= */
const LET='ABCDE';
const PG={w:215.9,h:279.4};
const FR={L:13,T:54,R:203,B:266}, FW=190, FH=212, MK=10;   // corner-marker centres
const AV={u0:7,u1:183,v0:-3,v1:207};                         // usable answer area inside the markers
const CODE={n:34,cw:3.2,x0:(190-34*3.2)/2};
const SMAX=1.8, VSTRETCH=1.5, HSTRETCH=1.4, GH=33.8, RB=77, GAP=1.2;
const MARK_MIN={1:0.16,2:0.25,3:0.38};
const FIELDS={
  roll:{label:'Roll number digits',min:2,max:6,step:1,help:'How many digits in each roll number (2 to 6).',layout:true},
  q:{label:'Number of questions',min:1,max:100,step:1,help:'From 1 to 100 questions.',layout:true},
  opt:{label:'Choices per question',min:2,max:5,step:1,help:'2 to 5 choices.',layout:true},
  mc:{label:'Points for a correct answer',min:0.5,max:20,step:0.5,help:'From 0.5 to 20.'},
  mi:{label:'Points taken off for a wrong answer',min:0,max:20,step:0.5,help:'0 means no deduction. Blank answers never lose points.'}
};

function crc6(bits){let c=0x2A;for(const b of bits){const t=((c>>5)&1)^b;c=(c<<1)&63;if(t)c^=0x03}return c}
function cfgBits(cfg){
  const f=[[cfg.roll-2,3],[cfg.q-1,7],[cfg.opt-2,2],[Math.round(cfg.mc*2)-1,6],[Math.round(cfg.mi*2),6]],b=[];
  f.forEach(([v,n])=>{for(let i=n-1;i>=0;i--)b.push((v>>i)&1)});
  const c=crc6(b);for(let i=5;i>=0;i--)b.push((c>>i)&1);return b;
}
function bitsCfg(b){
  const d=b.slice(0,24);let c=0;for(let i=24;i<30;i++)c=c*2+b[i];
  if(crc6(d)!==c)return null;
  let k=0;const rd=n=>{let v=0;for(let i=0;i<n;i++)v=v*2+d[k++];return v};
  const cfg={roll:rd(3)+2,q:rd(7)+1,opt:rd(2)+2,mc:(rd(6)+1)/2,mi:rd(6)/2};
  if(cfg.roll>6||cfg.q>100||cfg.mc>20||cfg.mi>20)return null;return cfg;
}
const _geo={},_plan={};
function plan(cfg){
  const id=cfg.roll+'-'+cfg.q+'-'+cfg.opt;if(_plan[id])return _plan[id];
  const AW=AV.u1-AV.u0,AH=AV.v1-AV.v0,G=Math.ceil(cfg.q/5);
  const wO=13.7+(cfg.opt-1)*6,w0=13.7+(Math.max(cfg.opt,cfg.roll)-1)*6;
  const colH=(c,n)=>(c===0?RB:0)+n*GH-(n?GAP:0);
  let best=null;
  for(let C=1;C<=6;C++){
    const cw=AW/C,cap=s=>({c0:Math.max(0,Math.floor((AH/s-RB+GAP)/GH)),k:Math.floor((AH/s+GAP)/GH)});
    const fits=s=>{const k=cap(s);return k.c0+(C-1)*k.k>=G};
    let hi=Math.min(SMAX,cw/w0),lo=0.5,s;if(hi<lo)continue;
    if(fits(hi))s=hi;else{if(!fits(lo))continue;for(let i=0;i<30;i++){const m=(lo+hi)/2;fits(m)?lo=m:hi=m}s=lo}
    const k=cap(s),dist=[];let R=G;
    for(let c=0;c<C;c++){
      if(c===C-1){dist.push(R);break}
      const rc=C-c,rest=(C-c-1)*k.k;
      let n=c===0?Math.round(((RB+R*GH)/rc-RB)/GH):Math.round(R/rc);
      n=Math.min(Math.max(n,R-rest,0),c===0?k.c0:k.k,R);dist.push(n);R-=n;
    }
    if(dist[C-1]>(C===1?k.c0:k.k))continue;
    if(C>1&&dist.slice(1).some(n=>n===0))continue;
    const hmax=Math.max(...dist.map((n,c)=>colH(c,n)))*s;
    const cand={C,s,cw,dist,f:Math.min(VSTRETCH,AH/hmax),fill:hmax/AH};

function parseCSV(t){

    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}

  if(!r.ok){
    Cam.hist=[];Cam.sawEmpty=true;Cam.best=0;
    const m=r.reason==='markers'?'Looking for the sheet… Make sure all 4 corner squares are in view.':'I see the squares, but can’t read the sheet. Hold steady and avoid shadows or glare.';
    if(single)alertBox('Couldn’t read this photo',[r.reason==='markers'?'The four black corner squares were not found. Take the photo from straight above with the whole sheet in view.':'The sheet was found but the code strip at the bottom could not be read. Retake the photo in brighter, even light.']);
    else status(m,'');return;
  }
  if(Cam.expect&&!sameLayout(r.cfg,Cam.expect)){
    const m=`This sheet was made for ${layoutText(r.cfg)}. Your exam uses ${layoutText(Cam.expect)}.`;
    Cam.hist=[];if(single)alertBox('This sheet doesn’t match your exam',[m]);else status(m,'bad');return;
  }
  if(r.pxmm<2&&!single){Cam.hist=[];status('Move the camera a little closer to the sheet.','warn');return}
  if(!single){
    const sh=sharpness(G,r.H,r.cfg);Cam.best=Math.max(sh,(Cam.best||0)*0.85);
    if(sh<0.2||sh<Cam.best*0.75){status('Hold still… the picture is a bit blurry.','warn');return}
  }
  const fills=readFills(G,r.H,r.cfg);
  if(single){capture(r,G,fills);return}
  const rd=interpret(fills),sig=rd.roll+'|'+rd.ans.map(a=>a.join('')).join(',');
  if(Cam.lastSig&&sig===Cam.lastSig&&!Cam.sawEmpty){status('Done with this sheet. Put the next sheet in view.','ok');Cam.hist=[];return}
  // Scan as soon as two looks at the sheet agree. Each look is corrected for tilt on its own, so a shaky hand is fine.
  Cam.hist.push({fills,sig});if(Cam.hist.length>5)Cam.hist.shift();
  const same=Cam.hist.filter(h=>h.sig===sig);
  if(same.length<2){status('Sheet found. Hold still…','ok');return}
  const n=same.length,avg={s:fills.s,roll:fills.roll.map((c,i)=>c.map((_,j)=>same.reduce((a,h)=>a+h.fills.roll[i][j],0)/n)),ans:fills.ans.map((c,i)=>c.map((_,j)=>same.reduce((a,h)=>a+h.fills.ans[i][j],0)/n))};
  capture(r,G,avg,sig);
}
function capture(r,G,fills,sig){
  const rd=interpret(fills);sig=sig||rd.roll+'|'+rd.ans.map(a=>a.join('')).join(',');
  Cam.paused=true;Cam.hist=[];if(Cam.mode!=='student'){beep('ok');buzz('ok')}
  status('Sheet scanned.','ok');
  Cam.onCap({cfg:r.cfg,roll:rd.roll,ans:rd.ans,base:rectify(G,r.H),sig});
}
function camResume(sig){Cam.lastSig=sig;Cam.sawEmpty=false;Cam.paused=false;Cam.lastMsg='';if(Cam.running)status('Put the next sheet in view.','')}
function photoPicked(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const G=toGray(img,img.naturalWidth,img.naturalHeight,2000,Cam.cv);URL.revokeObjectURL(url);const wasPaused=Cam.paused;Cam.paused=true;const r=analyze(G);handle(r,G,true);if(!r.ok||(Cam.expect&&!sameLayout(r.cfg,Cam.expect)))Cam.paused=wasPaused}catch(e){alertBox('Couldn’t read this photo',['Please try another photo.'])}};
  img.onerror=()=>alertBox('Couldn’t open this photo',['Please try a JPG or PNG photo.']);
  img.src=url;
}

function drawRect(canvas,cur,mode){
  const x=canvas.getContext('2d');x.putImageData(cur.base,0,0);const g=geo(cur.cfg),rad=g.d/2*RS+2;
  const P=b=>[(b.u+RM)*RS,(b.v+RM)*RS];
  const ring=(b,col,fill,dash)=>{const [px,py]=P(b);x.beginPath();x.arc(px,py,rad,0,Math.PI*2);x.setLineDash(dash?[4,3]:[]);x.lineWidth=3;x.strokeStyle=col;if(fill){x.fillStyle=fill;x.fill()}x.stroke();x.setLineDash([])};
  for(let d=0;d<cur.cfg.roll;d++){const ch=cur.roll[d];if(ch>='0'&&ch<='9')ring(g.roll[d][+ch],'#2152A3','rgba(33,82,163,.25)')}
  cur.ans.forEach((a,i)=>{
    if(mode!=='student'){a.forEach(o=>ring(g.ans[i].opts[o],a.length===1?'#2152A3':'#C98A12',a.length===1?'rgba(33,82,163,.25)':'rgba(201,138,18,.3)'));return}
    const k=S.key[i];
    if(a.length===1&&a[0]===k)ring(g.ans[i].opts[k],'#1B9A5A','rgba(27,154,90,.3)');
    else{a.forEach(o=>ring(g.ans[i].opts[o],a.length>1?'#C98A12':'#D03B28',a.length>1?'rgba(201,138,18,.3)':'rgba(208,59,40,.3)'));if(k!=null)ring(g.ans[i].opts[k],'#1B9A5A',null,true)}
  });
}
function mountCanvas(cur,mode){const box=$('#resImg');if(!box)return;let c=box.querySelector('canvas');if(!c){c=document.createElement('canvas');c.width=cur.base.width;c.height=cur.base.height;box.appendChild(c)}drawRect(c,cur,mode)}

function checkReasons(cur){
  const r=[],valid=/^\d+$/.test(cur.roll),st=valid?studentMap()[cur.roll]:null;
  if(!st)r.push(valid?`roll number ${cur.roll} is not in the class list`:'the roll number is unclear');
  const multi=cur.ans.map((a,i)=>a.length>1?i+1:0).filter(Boolean);
  if(multi.length)r.push(`question${multi.length>1?'s':''} ${multi.join(', ')} ha${multi.length>1?'ve':'s'} 2+ answers`);
  if(st&&S.results[cur.roll])r.push(`${st.name} already has a saved score`);
  return r;
}

/* ================= results & analysis ================= */
function stats(){
  const rows=S.students.map(s=>{const r=S.results[rk(s.roll)];return {s,r,g:r?grade(r.ans):null}}),done=rows.filter(x=>x.g);
  const sc=done.map(x=>x.g.score).sort((a,b)=>a-b),n=sc.length;
  return {rows,done,n,mean:n?sc.reduce((a,b)=>a+b,0)/n:0,hi:n?sc[n-1]:0,lo:n?sc[0]:0,med:n?(n%2?sc[(n-1)/2]:(sc[n/2-1]+sc[n/2])/2):0};
}
function itemStats(){
  const st=stats(),done=[...st.done].sort((a,b)=>b.g.score-a.g.score),n=done.length,k=Math.max(1,Math.round(n*.27));
  const up=done.slice(0,k),low=done.slice(-k);
  return Array.from({length:S.cfg.q},(_,i)=>{
    const cnt=Array(S.cfg.opt).fill(0);let blank=0,multi=0,right=0;
    done.forEach(x=>{const a=x.r.ans[i]||[];if(!a.length)blank++;else if(a.length>1)multi++;else cnt[a[0]]++;if(x.g.items[i]==='C')right++});
    const p=n?right/n:0,D=n>=5?(up.filter(x=>x.g.items[i]==='C').length-low.filter(x=>x.g.items[i]==='C').length)/k:null;
    const diff=p>=.76?'Very easy':p>=.61?'Easy':p>=.40?'Average':p>=.25?'Difficult':'Very difficult';
    const disc=D==null?'—':D>=.4?'Very good':D>=.3?'Good':D>=.2?'Fair':D>=0?'Poor':'Negative';
    const remark=D==null?'Need 5+ sheets':D<0?'Check the key':D>=.3&&p>=.25&&p<=.9?'Keep':D>=.2?'Improve':'Revise or replace';
    const unused=cnt.map((c,o)=>c===0&&o!==S.key[i]?LET[o]:null).filter(Boolean);
    return {i,cnt,blank,multi,right,p,D,diff,disc,remark,unused,n};
  });
}
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';

function excelBytes(){
  const q=S.cfg.q,head=['ROLL NO','STUDENT NAME',((S.exam.name||'').trim()+' SCORE').trim().toUpperCase(),...Array.from({length:q},(_,i)=>'QUESTION '+(i+1))];
  const rows=S.students.map(s=>{const r=S.results[rk(s.roll)],roll=/^0/.test(s.roll)?s.roll:Number(s.roll);
    if(!r)return [roll,s.name,'',...Array(q).fill('')];const g=grade(r.ans);return [roll,s.name,g.score,...g.items.map(t=>t==='C'?'OK':'X')]});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws['!cols']=[{wch:10},{wch:33.57},{wch:15},...Array(q).fill({wch:11.57})];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'results');
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}

  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(baseName())} report</title>
<style>body{font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#15202B;margin:0;background:#fff;padding:28px 18px;font-size:14px}main{max-width:1100px;margin:0 auto}

${NATIVE?'':'<a class="print" href="javascript:window.print()">Print this report</a>'}

${st.rows.map((x,i)=>`<tr><td class="num">${i+1}</td><td class="mono">${esc(rk(x.s.roll))}</td><td>${esc(x.s.name)}</td>${x.g?`<td class="num"><b>${fmt(x.g.score)}</b></td><td class="num">${pct(x.g.score,maxScore())}</td><td class="num">${x.g.c}</td><td class="num">${x.g.w}</td><td class="num">${x.g.b}</td>`:'<td class="num dim" colspan="5">Not scanned</td>'}</tr>`).join('')}</tbody></table></div>

/* ================= actions ================= */
function clampCfg(id,v){const f=FIELDS[id];v=Math.round(v/f.step)*f.step;return Math.min(f.max,Math.max(f.min,v))}
function setCfg(id,v){
  S.cfg[id]=v;if(FIELDS[id].layout){fitKey();S.sheetReady=S.sheetReady&&true}
  const inp=$('#f-'+id);if(inp&&document.activeElement!==inp)inp.value=v;
  const pv=$('#preview');if(pv)pv.innerHTML=sheetSVG(S.cfg);
  if(id==='opt'){const h=inp&&inp.closest('.field').querySelector('.help');if(h)h.textContent=`Letters A–${LET[v-1]}. ${FIELDS.opt.help}`}
  persist();
}

  go:b=>{const i=+b.dataset.i;if(canOpen(i)){S.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}},

  spin:b=>{const id=b.dataset.f,v=clampCfg(id,(+S.cfg[id])+(+b.dataset.d)*FIELDS[id].step);$('#f-'+id).value=v;$('#e-'+id).hidden=true;setCfg(id,v)},
  next0:()=>{S.sheetReady=true;fitKey();S.step=1;render();window.scrollTo({top:0})},
  dlSheet:()=>{if(!window.jspdf){toast('The PDF tool didn’t load. Check your internet and reload.','bad');return}
    saveFile(`bubble-sheet_${S.cfg.q}-items_${S.cfg.opt}-choices_${S.cfg.roll}-digit-roll.pdf`,sheetPDF(S.cfg),'application/pdf')},
  scanTemplate:()=>scannerModal('Scan an old bubble sheet','Hold the camera over a sheet printed from Bubble Tsek.','template',null,onTplCap),
  tplRescan:()=>{closeModal();ACT.scanTemplate()},
  tplUse:()=>{const cap=UI.cur;closeModal();S.cfg={...cap.cfg};S.key=cap.ans.map(a=>a.length===1?a[0]:null);S.keyFrom=S.key.some(v=>v!=null)?'scanned sheet':'';UI.keyErr=null;S.sheetReady=true;
    if(keyComplete()){S.step=2;toast('Settings and answer key loaded from the sheet')}else{S.step=1;toast('Settings loaded from the sheet')}render()},
  pickKey:()=>$('#fileKey').click(),
  scanKey:()=>scannerModal('Scan the answer key','Shade the correct answers on one bubble sheet, then hold the camera over it.','key',S.cfg,onKeyCap),
  keyRescan:()=>{closeModal();ACT.scanKey()},
  keyUse:()=>{const cap=UI.cur;closeModal();S.key=cap.ans.map(a=>a.length===1?a[0]:null);S.keyFrom='scanned sheet';UI.keyErr=null;render();toast(keyComplete()?'Answer key saved':'Answer key added. Fill in the empty ones.')},
  dlKeyTpl:()=>saveFile(`answer-key_${S.cfg.q}-items.csv`,'QUESTION,ANSWER\r\n'+Array.from({length:S.cfg.q},(_,i)=>`${i+1},${S.key[i]!=null?LET[S.key[i]]:''}`).join('\r\n')+'\r\n','text/csv'),
  setKey:b=>{const q=+b.dataset.q,o=+b.dataset.o;S.key[q]=S.key[q]===o?null:o;S.keyFrom=S.keyFrom||'typed in';
    const row=b.closest('.krow');row.querySelectorAll('.bub').forEach((x,i)=>{const on=S.key[q]===i;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});row.classList.toggle('miss',S.key[q]==null);
    persist();const n=keyCount(),pill=$('#main .pill');if(pill){pill.className='pill '+(n===S.cfg.q?'ok':'warn');pill.textContent=n===S.cfg.q?'✓ Answer key complete':`${n} of ${S.cfg.q} answers set`}
    const nx=$('#main .actions .btn.primary');if(nx)nx.disabled=!keyComplete();$('#stepper').innerHTML;renderStepperOnly()},
  clearKey:()=>confirmBox('Clear the answer key?','All answers you set will be removed.',[{label:'Clear answers',cls:'danger',fn:()=>{S.key=Array(S.cfg.q).fill(null);S.keyFrom='';render()}}]),
  pickList:()=>$('#fileList').click(),
  dlListEx:()=>saveFile('example classlist with roll number.csv','STUDENT NAME,ROLL NO\r\n"ABESIA, ALEXA JOHNNYHL FABIA",301\r\n"AGATON, JENILYN DE JESUS",302\r\n"AGUILOR, KIRLYN DAPILAGA",303\r\n"ALBALADEJO, ELIJAH JARED IGNACIO",304\r\n"ANDRES, JOHN RANDELLE VERANO",305\r\n','text/csv'),
  camStart:b=>{if(b&&b.dataset.p!=null&&b.dataset.p!==Cam.p)return;camStart()},
  camStop:()=>camStop(),
  photo:()=>{audioUnlock();const f=$('#filePhoto');f.value='';f.click()},
  sens:b=>{S.sens=+b.dataset.v;persist();$('#scanSide').innerHTML=scanSide()},
  resDiscard:()=>{const cur=UI.cur,sig=cur.sig;if(cur.autoSaved){delete S.results[cur.savedRoll];persist();refreshSide()}
    closeModal();camResume(sig);toast(cur.autoSaved?'Score removed. Move the sheet away before scanning it again.':'Discarded. Move the sheet away before scanning it again.')},
  tglAuto:()=>{S.autoSave=!S.autoSave;persist();refreshSide();toast(S.autoSave?'Auto-save is on. Sheets that need checking will still stop.':'Auto-save is off. You will confirm each sheet.')},
  tglSound:()=>{S.sound=S.sound===false;persist();refreshSide();if(S.sound){audioUnlock();beep('ok')}},
  apUndo:()=>{if(!UI.ap)return;const cur=UI.ap.cur;hideAutoPop();UI.ap=null;delete S.results[cur.savedRoll];persist();refreshSide();
    toast('Undone. The score was not saved.');camResume(cur.sig)},
  apEdit:()=>{if(!UI.ap)return;const cur=UI.ap.cur;hideAutoPop();UI.ap=null;UI.cur=cur;cur.editing=true;
    openModal(resultModal(),{wide:true,onClose:()=>{}});mountCanvas(cur,'student')},
  resEdit:()=>{UI.cur.editing=!UI.cur.editing;const e=$('#resEdit');e.hidden=!UI.cur.editing;e.innerHTML=UI.cur.editing?resEditor():'';refreshRes();if(UI.cur.editing)$('#edRoll').focus()},
  edAns:b=>{const q=+b.dataset.q,o=+b.dataset.o,a=UI.cur.ans[q];const k=a.indexOf(o);if(k>=0)a.splice(k,1);else{a.push(o);a.sort()}
    b.closest('.krow').querySelectorAll('.bub').forEach((x,i)=>{x.classList.toggle('on',a.includes(i));x.setAttribute('aria-pressed',a.includes(i))});refreshRes()},
  resSave:()=>{const cur=UI.cur,st=studentMap()[cur.roll];if(!st)return;
    if(cur.autoSaved&&cur.savedRoll&&cur.savedRoll!==cur.roll)delete S.results[cur.savedRoll];
    S.results[cur.roll]={roll:cur.roll,ans:cur.ans.map(a=>[...a]),at:Date.now()};persist();
    const g=grade(cur.ans);closeModal();toast(`Saved: ${st.name}, ${fmt(g.score)}/${fmt(maxScore())}`);
    const side=$('#scanSide');if(side)side.innerHTML=scanSide();renderStepperOnly();camResume(cur.sig)},
  tab:b=>{S.tab=b.dataset.t;persist();render();const t=$('.tabs');if(t)t.scrollIntoView({behavior:'smooth',block:'start'})},
  delRes:b=>{const r=b.dataset.r,s=studentMap()[r];confirmBox('Remove this score?',`${esc(s?s.name:r)}’s saved score will be removed. You can scan the sheet again.`,[{label:'Remove score',cls:'danger',fn:()=>{delete S.results[r];render()}}])},
  shareExcel:()=>{if(!window.XLSX){toast('The Excel tool did not load. Please restart the app.','bad');return}
    shareFile(baseName()+'.xlsx',excelBytes(),`${S.exam.name} – ${S.exam.section} results (${S.exam.date})`)},
  shareReport:()=>shareFile(baseName()+'_report.html',reportHTML(),`${S.exam.name} – ${S.exam.section} report`),
  dlExcel:()=>{if(!window.XLSX){toast('The Excel tool didn’t load. Check your internet and reload.','bad');return}saveFile(baseName()+'.xlsx',excelBytes(),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')},
  report:()=>{const html=reportHTML();
    if(NATIVE){openModal(`<div style="display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Report</h2><div style="display:flex;gap:8px"><button class="btn small" data-act="shareReport">${ICON.share} Share</button><button class="btn small" data-act="closeModal">Close</button></div></div><iframe id="repFrame" title="Report" style="width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>`,{wide:true});$('#repFrame').srcdoc=html;return}let w=null;try{w=window.open('','_blank')}catch(e){}
    if(w){try{w.document.open();w.document.write(html);w.document.close();return}catch(e){try{w.close()}catch(x){}}}
    try{const u=URL.createObjectURL(new Blob([html],{type:'text/html'}));const w2=window.open(u,'_blank');if(w2)return}catch(e){}
    toast('Your browser blocked the new tab, so the report will download instead.');saveFile(baseName()+'_report.html',html,'text/html')},
  newExam:()=>confirmBox('Start a new exam?','Saved scores for this exam will be cleared. Download the Excel file first if you still need it.',[
    {label:'Keep class list',fn:()=>{const k={students:S.students,listName:S.listName,sens:S.sens,cfg:S.cfg};S=Object.assign(fresh(),k);fitKey();UI.keyErr=UI.listErr=UI.listWarn=null;render()}},
    {label:'Start fresh',cls:'primary',fn:()=>{S=fresh();UI.keyErr=UI.listErr=UI.listWarn=null;render()}}])
};
function renderStepperOnly(){const cur=S.step;$('#stepper').querySelectorAll('.st').forEach((b,i)=>{const done=stepDone(i)&&i!==cur;b.classList.toggle('done',done);b.disabled=!canOpen(i);b.querySelector('.st-b').textContent=done?'✓':i+1})}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#resSave'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!$('#resSave'))closeModal()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cfg){const id=t.dataset.cfg,f=FIELDS[id],v=parseFloat(t.value),er=$('#e-'+id);
    const bad=isNaN(v)||v<f.min||v>f.max||Math.abs(Math.round(v/f.step)*f.step-v)>1e-9;
    er.hidden=!bad;er.textContent=`Enter a number from ${f.min} to ${f.max}${f.step<1?' (steps of 0.5)':''}.`;if(!bad)setCfg(id,v)}
  if(t.dataset.exam){S.exam[t.dataset.exam]=t.value;persist();const fn=$('#fname');if(fn)fn.textContent=baseName()+'.xlsx';const n=$('#next2');if(n)n.disabled=!detailsDone();renderStepperOnly()}
  if(t.dataset.ed==='roll'){t.value=t.value.replace(/\D/g,'').slice(0,S.cfg.roll);UI.cur.roll=t.value.length===S.cfg.roll?t.value:t.value.padEnd(S.cfg.roll,'?');refreshRes()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.cfg){const id=t.dataset.cfg,v=clampCfg(id,parseFloat(t.value)||FIELDS[id].min);t.value=v;$('#e-'+id).hidden=true;setCfg(id,v);renderStepperOnly()}});
$('#fileKey').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const rows=await readRows(file),q=S.cfg.q,opt=S.cfg.opt,letters=LET.slice(0,opt),errs=[],key=Array(q).fill(null);
    let data=rows;if(data.length&&!/^\s*\d+\s*$/.test(data[0][0])&&!/^\s*[a-e]\s*$/i.test(data[0][0]))data=data.slice(1);
    const oneCol=data.every(r=>r.filter(c=>String(c).trim()!=='').length<=1)&&data.every(r=>!/^\s*\d+\s*$/.test(r[0]));
    if(!data.length)errs.push('The file has no answers.');
    data.forEach((r,idx)=>{
      let n,a;if(oneCol){n=idx+1;a=String(r[0]??'').trim().toUpperCase()}else{n=String(r[0]??'').trim();a=String(r[1]??'').trim().toUpperCase()}
      if(!/^\d+$/.test(String(n))){errs.push(`Row ${idx+2}: “${n}” is not a question number.`);return}
      n=+n;if(n<1||n>q){errs.push(`Question ${n} is in the file, but your bubble sheet has only ${q} question${q>1?'s':''}.`);return}
      if(!a){errs.push(`Question ${n} has no answer.`);return}
      if(!letters.includes(a)||a.length!==1){errs.push(`Question ${n}: “${a}” is not a valid choice. Your sheet only has ${letters.split('').join(', ')}.`);return}
      if(key[n-1]!=null&&key[n-1]!==letters.indexOf(a))errs.push(`Question ${n} appears more than once with different answers.`);
      key[n-1]=letters.indexOf(a);
    });
    const miss=key.map((v,i)=>v==null?i+1:null).filter(Boolean);
    if(miss.length&&miss.length<q)errs.push(`Missing answers for question${miss.length>1?'s':''} ${miss.slice(0,12).join(', ')}${miss.length>12?'…':''}.`);
    else if(miss.length===q&&data.length)errs.push('No usable answers were found.');
    if(errs.length){UI.keyErr=[...new Set(errs)];render();alertBox('This answer key doesn’t fit your bubble sheet',UI.keyErr);return}
    S.key=key;S.keyFrom=file.name;UI.keyErr=null;render();toast('Answer key uploaded');
  }catch(err){UI.keyErr=[err.message||'The file could not be read.'];render();alertBox('Couldn’t read the file',UI.keyErr)}
});
$('#fileList').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const rows=await readRows(file),errs=[],warns=[];
    if(!rows.length)throw new Error('The file is empty.');
    const head=rows[0].map(c=>String(c).trim().toUpperCase()),ni=head.findIndex(h=>h.includes('NAME')),ri=head.findIndex(h=>h.includes('ROLL'));
    if(ni<0||ri<0)throw new Error('The first row must have the column names STUDENT NAME and ROLL NO, like the example file.');
    const list=[];
    rows.slice(1).forEach((r,i)=>{const line=i+2,name=String(r[ni]??'').trim(),roll=String(r[ri]??'').trim().replace(/\.0+$/,'');
      if(!name&&!roll)return;if(!roll){errs.push(`Line ${line}: ${name} has no roll number.`);return}
      if(!/^\d+$/.test(roll)){errs.push(`Line ${line}: roll number “${roll}” should only have digits.`);return}
      if(!name)warns.push(`Line ${line}: roll number ${roll} has no name.`);list.push({name:name||'(no name)',roll})});
    if(!list.length&&!errs.length)errs.push('No students were found under the column names.');
    if(errs.length){UI.listErr=errs;UI.listWarn=null;render();alertBox('We couldn’t use that file',errs);return}
    S.students=list;S.listName=file.name;UI.listErr=null;UI.listWarn=warns;render();
    const iss=listIssues();if(iss.length)alertBox('Please fix the class list',iss);else toast(`${list.length} students loaded`);
  }catch(err){UI.listErr=[err.message];render();alertBox('We couldn’t use that file',UI.listErr)}
});
$('#filePhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  if(!Cam.onCap){toast('Open the scanner first.','bad');return}photoPicked(f)});
if(S.key.length!==S.cfg.q)fitKey();
if(NATIVE){$('#fileKey').removeAttribute('accept');$('#fileList').removeAttribute('accept');document.documentElement.classList.add('native')}
render();
